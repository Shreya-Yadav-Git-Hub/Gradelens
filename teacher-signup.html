<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GradeLens | Teacher Sign Up</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="welcome-container">

        <div class="brand">
            <h1>GradeLens</h1>
            <p>Student Performance Analytics System</p>
        </div>


        <div class="login-box">

            <h2>Create Teacher Account</h2>

            <p>Enter your details to get started</p>


            <form id="teacherSignupForm">

                <label for="teacherName">
                    Full Name
                </label>

                <input
                    type="text"
                    id="teacherName"
                    placeholder="Enter your full name"
                    required
                >


                <label for="employeeId">
                    Employee ID
                </label>

                <input
                    type="text"
                    id="employeeId"
                    placeholder="Enter your employee ID"
                    required
                >


                <label for="teacherEmail">
                    Email
                </label>

                <input
                    type="email"
                    id="teacherEmail"
                    placeholder="Enter your email"
                    required
                >


                <label for="department">
                    Department
                </label>

                <input
                    type="text"
                    id="department"
                    placeholder="Enter your department"
                    required
                >


                <label for="teacherPassword">
                    Password
                </label>

                <input
                    type="password"
                    id="teacherPassword"
                    placeholder="Create a password"
                    required
                >


                <label for="teacherConfirmPassword">
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="teacherConfirmPassword"
                    placeholder="Confirm your password"
                    required
                >


                <button type="submit">
                    Create Account
                </button>

            </form>


            <p class="signup-text">

                Already have an account?

                <a href="teacher-login.html">
                    Login
                </a>

            </p>

        </div>


        <p class="footer-text">
            &copy; 2026 GradeLens
        </p>

    </div>


    <script src="script.js"></script>

</body>

</html>
