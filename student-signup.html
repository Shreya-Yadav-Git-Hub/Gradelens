<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GradeLens | Student Sign Up</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="welcome-container">

        <div class="brand">
            <h1>GradeLens</h1>
            <p>Student Performance Analytics System</p>
        </div>


        <div class="login-box">

            <h2>Create Student Account</h2>

            <p>Enter your details to get started</p>


            <form id="studentSignupForm">

                <label for="studentName">
                    Full Name
                </label>

                <input
                    type="text"
                    id="studentName"
                    placeholder="Enter your full name"
                    required
                >


                <label for="studentRollNo">
                    Roll Number
                </label>

                <input
                    type="text"
                    id="studentRollNo"
                    placeholder="Enter your roll number"
                    required
                >


                <label for="studentEmail">
                    Email
                </label>

                <input
                    type="email"
                    id="studentEmail"
                    placeholder="Enter your email"
                    required
                >


                <label for="studentPassword">
                    Password
                </label>

                <input
                    type="password"
                    id="studentPassword"
                    placeholder="Create a password"
                    required
                >


                <label for="studentConfirmPassword">
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="studentConfirmPassword"
                    placeholder="Confirm your password"
                    required
                >


                <button type="submit">
                    Create Account
                </button>

            </form>


            <p class="signup-text">

                Already have an account?

                <a href="student-login.html">
                    Login
                </a>

            </p>

        </div>


        <p class="footer-text">
            &copy; 2026 GradeLens
        </p>

    </div>


    <script src="script.js"></script>

</body>

</html>
